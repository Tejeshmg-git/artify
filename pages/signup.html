<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artify | Join the Collective - Create your Account</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    
    <!-- CSS Baseline -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
</head>
<body>

    <nav class="minimal-nav">
        <a href="../index.html" class="back-home">
            <i data-lucide="arrow-left" style="width: 18px;"></i>
            Back to Home
        </a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                <i data-lucide="moon"></i>
            </button>
        </div>
    </nav>

    <main class="auth-wrapper">
        <!-- Visual Side -->
        <div class="auth-visual">
            <div class="visual-placeholder" style="position: absolute; inset: 0; opacity: 0.1;"></div>
            <div class="auth-quote" style="text-align: left;">
                <h2>Fuel your <span class="text-gradient">creative</span> journey.</h2>
                <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 40px;">
                    <div style="display: flex; gap: 16px; align-items: flex-start;">
                        <i data-lucide="check-circle-2" style="color: var(--primary); margin-top: 5px;"></i>
                        <div>
                            <h4 style="color: var(--text-primary); margin-bottom: 4px;">Premium Gallery</h4>
                            <p>Showcase your work in a cinematic editorial environment.</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 16px; align-items: flex-start;">
                        <i data-lucide="check-circle-2" style="color: var(--secondary); margin-top: 5px;"></i>
                        <div>
                            <h4 style="color: var(--text-primary); margin-bottom: 4px;">Global Print Network</h4>
                            <p>Ship high-end art to collectors in 120+ countries.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form Side -->
        <div class="auth-container">
            <div class="auth-form">
                <div class="auth-header">
                    <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 24px;">
                        <i data-lucide="palette"></i>
                        Artify
                    </a>
                    <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Create Account</h1>
                    <p style="color: var(--text-secondary);">Join 5,000+ creators on Artify.</p>
                </div>

                <div class="social-auth">
                    <button class="social-btn">
                        <i data-lucide="chrome" style="width: 18px;"></i> Google
                    </button>
                    <button class="social-btn">
                        <i data-lucide="apple" style="width: 18px;"></i> Apple
                    </button>
                </div>

                <div class="divider">OR USE YOUR EMAIL</div>

                <form action="user-dashboard.html">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">FIRST NAME</label>
                            <input type="text" class="form-input" placeholder="Jane" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">LAST NAME</label>
                            <input type="text" class="form-input" placeholder="Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">EMAIL ADDRESS</label>
                        <input type="email" class="form-input" placeholder="artist@studio.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">PASSWORD</label>
                        <input type="password" class="form-input" placeholder="Minimum 8 characters" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 16px; margin-top: 12px;">Create Account <i data-lucide="user-plus" style="width: 18px;"></i></button>
                </form>

                <div class="form-footer">
                    Already have an account? <a href="signin.html" style="color: var(--primary); font-weight: 700;">Sign In</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        lucide.createIcons({ icons: lucide.icons });
    </script>
</body>
</html>
