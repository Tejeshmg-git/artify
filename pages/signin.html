<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artify | Sign In - Return to your Studio</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    
    <!-- CSS Baseline -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
</head>
<body>

    <nav class="minimal-nav">
        <a href="../index.html" class="back-home">
            <i data-lucide="arrow-left" style="width: 18px;"></i>
            Back to Home
        </a>
        <div style="display: flex; align-items: center; gap: 20px;">
            <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                <i data-lucide="moon"></i>
            </button>
        </div>
    </nav>

    <main class="auth-wrapper">
        <!-- Visual Side -->
        <div class="auth-visual">
            <div class="visual-placeholder" style="position: absolute; inset: 0;"></div>
            <div class="auth-quote">
                <i data-lucide="quote" style="width: 40px; height: 40px; color: var(--primary); margin-bottom: 24px;"></i>
                <h2>"Art is the only way to run away without leaving home."</h2>
                <p style="color: var(--text-secondary);">Twyla Tharp</p>
            </div>
        </div>

        <!-- Form Side -->
        <div class="auth-container">
            <div class="auth-form">
                <div class="auth-header">
                    <a href="../index.html" class="logo" style="justify-content: center; margin-bottom: 24px;">
                        <i data-lucide="palette"></i>
                        Artify
                    </a>
                    <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Welcome Back</h1>
                    <p style="color: var(--text-secondary);">Continue your creative journey.</p>
                </div>

                <div class="social-auth">
                    <button class="social-btn">
                        <i data-lucide="chrome" style="width: 18px;"></i> Google
                    </button>
                    <button class="social-btn">
                        <i data-lucide="apple" style="width: 18px;"></i> Apple
                    </button>
                </div>

                <div class="divider">OR CONTINUE WITH</div>

                <form action="user-dashboard.html">
                    <div class="form-group">
                        <label class="form-label">EMAIL ADDRESS</label>
                        <input type="email" class="form-input" placeholder="artist@studio.com" required>
                    </div>
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label class="form-label" style="margin-bottom: 0;">PASSWORD</label>
                            <a href="#" style="font-size: 0.8rem; color: var(--primary); font-weight: 600;">Forgot?</a>
                        </div>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" id="password-toggle">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 16px; margin-top: 24px;">Sign In <i data-lucide="log-in" style="width: 18px;"></i></button>
                </form>

                <div class="form-footer">
                    Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700;">Create One</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        lucide.createIcons({ icons: lucide.icons });

        // Password Visibility Toggle
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('password-toggle');
        const eyeIcon = passwordToggle.querySelector('i');

        passwordToggle.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            
            // Update Icon
            passwordToggle.innerHTML = isPassword ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
            lucide.createIcons();
        });
    </script>
</body>
</html>
